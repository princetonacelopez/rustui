name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Clippy & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev libvulkan-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Headless examples check
        run: |
          cargo run -p rustui --bin rustui -- doctor
          RUSTUI_HEADLESS=1 cargo run -p rustui --example counter
          RUSTUI_HEADLESS=1 cargo run -p rustui --example todo
          RUSTUI_HEADLESS=1 cargo run -p rustui --example text_editor
          RUSTUI_HEADLESS=1 cargo run -p rustui --example dashboard
          RUSTUI_HEADLESS=1 cargo run -p rustui --example terminal

  licenses:
    name: License Check (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
