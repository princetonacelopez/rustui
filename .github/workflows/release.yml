name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rustui
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rustui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rustui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype-dev libdbus-1-dev libvulkan-dev
      - name: Build CLI release binary
        run: cargo build --release -p rustui --bin rustui
      - name: Verify tests
        env:
          RUSTUI_SOFTWARE_RENDER: "1"
        run: cargo test --workspace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustui-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}
